spring.application.name=oficina-billing-service
server.port=8082
spring.profiles.default=local

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billing_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Mercado Pago - Checkout Pro & Webhooks
mp.access.token=${MP_ACCESS_TOKEN:}
mp.public.key=${MP_PUBLIC_KEY:}
mp.webhook.secret=${MP_WEBHOOK_SECRET:}
mp.webhook.public.url=${MP_WEBHOOK_PUBLIC_URL:http://localhost:8082/webhooks/mercadopago}
mp.back.url.success=${MP_BACK_URL_SUCCESS:https://oficina.com.br/pagamentos/sucesso}
mp.back.url.failure=${MP_BACK_URL_FAILURE:https://oficina.com.br/pagamentos/falha}
mp.back.url.pending=${MP_BACK_URL_PENDING:https://oficina.com.br/pagamentos/pendente}
mp.auto.return=approved
mp.statement.descriptor=OFICINA
mp.sandbox.mode=true

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html

