spring.application.name=oficina-billing-service
server.port=8082
spring.profiles.default=local

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billing_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Mercado Pago - Checkout Pro & Webhooks
mp.access.token=${MP_ACCESS_TOKEN:}
mp.public.key=${MP_PUBLIC_KEY:}
mp.webhook.secret=${MP_WEBHOOK_SECRET:}
mp.webhook.public.url=${MP_WEBHOOK_PUBLIC_URL:http://localhost:8082/webhooks/mercadopago}
mp.back.url.success=${MP_BACK_URL_SUCCESS:https://oficina.com.br/pagamentos/sucesso}
mp.back.url.failure=${MP_BACK_URL_FAILURE:https://oficina.com.br/pagamentos/falha}
mp.back.url.pending=${MP_BACK_URL_PENDING:https://oficina.com.br/pagamentos/pendente}
mp.auto.return=approved
mp.statement.descriptor=OFICINA
mp.sandbox.mode=true

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator / Kubernetes Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# Segurança / JWT (compartilhado com oficina-app-api e oficina-auth-gateway)
jwt.secret=${JWT_SECRET:c2VjcmV0b0p3dFN1cGVyU2VndXJvUGFyYU9maWNpbmFBcGkxMjM0NTY3ODk=}

# Mensageria da Saga (ADR 005 em oficina-app-api). Desligada por padrão: os eventos são
# gravados na outbox, mas só saem do serviço com MENSAGERIA_HABILITADA=true.
mensageria.habilitada=${MENSAGERIA_HABILITADA:false}
mensageria.produtor=oficina-billing-service
mensageria.topico-arn=${MENSAGERIA_TOPICO_ARN:}
mensageria.fila-url=${MENSAGERIA_FILA_URL:}
mensageria.regiao=${AWS_REGION:us-east-1}
# LocalStack em dev (ex.: http://localhost:4566); vazio usa a AWS
mensageria.endpoint=${MENSAGERIA_ENDPOINT:}
# relay da outbox + consumidor SQS (long polling) não podem disputar a mesma thread
spring.task.scheduling.pool.size=2
