apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/billing_db
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_PROFILES_ACTIVE: prod
  APP_PORT: "8082"
  MP_AUTO_RETURN: approved
  MP_SANDBOX_MODE: "true"
  # Observabilidade (ADR 002 da app-api): agente OpenTelemetry exportando por OTLP para o New Relic.
  # A license key (OTEL_EXPORTER_OTLP_HEADERS) e o liga/desliga (OTEL_SDK_DISABLED) vêm do Secret.
  OTEL_SERVICE_NAME: oficina-billing-service
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=oficina
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.nr-data.net:4318
