apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: oficina-billing
  name: oficina-billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-billing
  template:
    metadata:
      labels:
        app: oficina-billing
    spec:
      containers:
        - name: oficina-billing
          image: oficina-billing-image
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: billing-config
            - secretRef:
                name: billing-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 5
            failureThreshold: 30
