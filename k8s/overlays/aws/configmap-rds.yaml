apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/billing_db
  SPRING_PROFILES_ACTIVE: prod
  # Mensageria (ADR 005 em oficina-app-api). ARN e URL dependem do account ID da sessão do
  # Learner Lab: o deploy.yml resolve os valores reais pelo nome do tópico/fila antes do apply.
  MENSAGERIA_HABILITADA: "true"
  MENSAGERIA_TOPICO_ARN: arn:aws:sns:us-east-1:ACCOUNT_ID:oficina-billing-events
  MENSAGERIA_FILA_URL: https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/oficina-billing-queue
