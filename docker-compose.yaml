services:
  billing-db:
    image: postgres:15-alpine
    container_name: billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billing_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - billing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-localstack:
    # Versão fixada: SNS/SQS locais para a mensageria da Saga (ADR 005 em oficina-app-api)
    image: localstack/localstack:4.4.0
    container_name: billing-localstack
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack/init-mensageria.sh:/etc/localstack/init/ready.d/init-mensageria.sh
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mensageria-pronta"]
      interval: 5s
      timeout: 5s
      retries: 20

  billing-app:
    build: .
    container_name: billing-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-db:5432/${POSTGRES_DB:-billing_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      SPRING_PROFILES_ACTIVE: default
      # Mensageria (LocalStack)
      MENSAGERIA_HABILITADA: "true"
      MENSAGERIA_ENDPOINT: http://billing-localstack:4566
      MENSAGERIA_TOPICO_ARN: arn:aws:sns:us-east-1:000000000000:oficina-billing-events
      MENSAGERIA_FILA_URL: http://billing-localstack:4566/000000000000/oficina-billing-queue
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
    depends_on:
      billing-db:
        condition: service_healthy
      billing-localstack:
        condition: service_healthy

volumes:
  billing_pgdata:
