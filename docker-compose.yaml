services:
  billing-db:
    image: postgres:15-alpine
    container_name: billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billing_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - billing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-app:
    build: .
    container_name: billing-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-db:5432/${POSTGRES_DB:-billing_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      SPRING_PROFILES_ACTIVE: default
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
    depends_on:
      billing-db:
        condition: service_healthy

volumes:
  billing_pgdata:
